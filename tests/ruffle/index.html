<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Wars — AS3Probe Ruffle Smoke</title>
  <style>
    body{margin:0;background:#101722;color:#e7f1fa;font:14px sans-serif}
    #container{width:800px;height:500px;margin:14px auto;background:#202d3b}
    #message{padding:10px}
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath: "/tests/ruffle/node_modules/@ruffle-rs/ruffle/",
      polyfills: false,
      autoplay: "on",
      unmuteOverlay: "hidden",
      logLevel: "warn",
      warnOnUnsupportedContent: false
    };
    window.__swTrace = [];
    window.__swDone = false;
    window.__swError = null;
    window.__swStage = "before-ruffle";
  </script>
  <script src="/tests/ruffle/node_modules/@ruffle-rs/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="container"></div>
  <div id="message">Inicializando Ruffle...</div>
  <script>
    (async function () {
      try {
        window.__swStage = "creating-player";
        const player = window.RufflePlayer.newest().createPlayer();
        document.getElementById("container").appendChild(player);
        window.__swStage = "trace-observer";
        player.ruffle().traceObserver = function (message) {
          const str = String(message).trim();
          window.__swTrace.push(str);
          console.log("AVM2_TRACE " + str);
          if (str.indexOf("SWTEST:SUMMARY ") === 0) {
            window.__swDone = true;
            document.getElementById("message").textContent = str;
          }
        };
        window.__swStage = "loading-swf";
        const swfResponse = await fetch("/dist/AS3Probe.swf", {cache:"no-store"});
        if (!swfResponse.ok) throw new Error("SWF HTTP " + swfResponse.status);
        const swfData = await swfResponse.arrayBuffer();
        window.__swSwfLength = swfData.byteLength;
        window.__swStage = "loading-buffer";
        await player.ruffle().load({
          data: swfData,
          swfFileName: "AS3Probe.swf",
          autoplay: "on",
          splashScreen: false
        });
        window.__swApiState = {
          readyState: String(player.ruffle().readyState),
          suspendedBeforeResume: Boolean(player.ruffle().suspended),
          metadata: player.ruffle().metadata
        };
        player.ruffle().resume();
        window.__swApiState.suspendedAfterResume = Boolean(player.ruffle().suspended);
        window.__swLoaded = true;
        window.__swStage = "load-resolved";
      } catch (e) {
        window.__swError = String(e && e.stack || e);
        window.__swStage = "load-error";
        console.error("Ruffle load error:", e);
      }
    })();
  </script>
</body>
</html>
