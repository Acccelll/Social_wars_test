name: Original Popup Button MOUSE_UP 5D.8F

on:
  push:
    paths:
      - ".github/workflows/original-button-5d8f.yml"
      - "tools/seed_original_units_5d8c.py"
      - "tools/seed_original_units_5d8c_test.py"
      - "tests/original/record.mjs"
      - "tests/original/observer.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-button-5d8f
  cancel-in-progress: false

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate fixture and screenshot methods
        run: |
          python tools/seed_original_units_5d8c_test.py
          python -m pip install pillow
          python tools/analyze_runtime_5d8b_test.py

      - name: Install browser and Ruffle
        run: |
          npm install --prefix tests/ruffle --no-audit --no-fund
          npx --prefix tests/ruffle playwright install chromium
          node tests/original/test.mjs

      - name: Download original Social Wars distribution and Python server
        run: |
          mkdir -p runtime/release
          curl --fail --location --retry 3 --connect-timeout 20 \
            "https://github.com/AcidCaos/socialwarriors/releases/download/0.02a/social-warriors_0.02a.zip" \
            -o runtime/release.zip
          test "$(stat -c %s runtime/release.zip)" = "492630085"
          unzip -q runtime/release.zip -d runtime/release
          asset_file="$(find runtime/release -path '*/assets/flash/Basesec_1.5.4.swf' -type f -print -quit)"
          test -n "$asset_file"
          asset_dir="$(realpath "$(dirname "$(dirname "$asset_file")")")"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/AcidCaos/socialwarriors.git runtime/source
          git -C runtime/source sparse-checkout set config villages templates stub mods
          ln -s "$asset_dir" runtime/source/assets
          test -f runtime/source/server.py
          mkdir -p runtime/source/saves
          echo "SW_SERVER_DIR=$(realpath runtime/source)" >> "$GITHUB_ENV"

      - name: Verify unit IDs and seed only disposable initial village
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          patch=json.loads(Path("runtime/source/config/patch/unit_patch.json").read_text())
          catalog={int(row["value"]["id"]):row["value"] for row in patch
                   if isinstance(row,dict) and "value" in row and
                   isinstance(row["value"],dict) and "id" in row["value"]}
          for key in [1313,1358,1376]:
              assert catalog[key]["type"]=="u"
              print("SOURCE_UNIT_VERIFIED",key,catalog[key]["name"],
                    catalog[key]["img_name"])
          PY
          python tools/seed_original_units_5d8c.py \
            --initial "$SW_SERVER_DIR/villages/initial.json" \
            --out "$SW_SERVER_DIR/villages/initial_for_test.json" \
            --manifest runtime/fixture_5d8c.json
          mv "$SW_SERVER_DIR/villages/initial_for_test.json" "$SW_SERVER_DIR/villages/initial.json"
          echo "Fixture affects isolated clone ONLY."

      - name: Start real Flask server on loopback
        run: |
          python -m pip install 'flask==2.2.5' 'werkzeug==2.3.8' requests jsonpatch
          cd "$SW_SERVER_DIR"
          nohup python -u server.py --host 127.0.0.1 --port 5055 \
            > "$GITHUB_WORKSPACE/runtime/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5055/health; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/runtime/server.log"
          exit 1

      - name: Test Flash PopupMissionInfo OK MOUSE_UP with distinct browser events
        run: |
          node tests/original/record.mjs --server http://127.0.0.1:5055 \
            --headless --create-test-village --button-event-probe --duration 2 \
            --out dist/button-event-5d8f
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path("dist/button-event-5d8f")
          report=json.loads((root/"report.json").read_text())
          assert report["state"]["rufflePlayerCount"]>=1
          assert any(e["type"]=="button_mouseup_event_probe" for e in report["events"])
          assert len([e for e in report["events"] if e["type"]=="pointer"])>=1
          names=["event-before.png","event-hover.png","event-down.png",
                 "event-up.png","event-second-up.png","session.webm"]
          assert all((root/f).stat().st_size>1000 for f in names)
          rect=(558,652,734,708)
          dialog=(275,145,995,709)
          def fraction(before,after,bounds):
              with Image.open(root/before) as a,Image.open(root/after) as b:
                  img=ImageChops.difference(a.convert("RGB").crop(bounds),
                                            b.convert("RGB").crop(bounds)).convert("L")
                  mask=img.point(lambda v:255 if v>=22 else 0)
                  return round(mask.histogram()[255]/((bounds[2]-bounds[0])*
                           (bounds[3]-bounds[1])),6)
          scores={
             "hover_vs_before_button":fraction("event-before.png","event-hover.png",rect),
             "down_vs_hover_button":fraction("event-hover.png","event-down.png",rect),
             "up_vs_down_button":fraction("event-down.png","event-up.png",rect),
             "dialog_up_vs_before":fraction("event-before.png","event-up.png",dialog),
             "dialog_second_up_vs_before":fraction("event-before.png","event-second-up.png",dialog),
             "dialog_second_up_vs_first_up":fraction("event-up.png","event-second-up.png",dialog)
          }
          result={
              "original_swf":"Basesec_1.5.4.swf",
              "candidate_class":"popups.PopupMissionInfo",
              "handler_declared":"btnOk MouseEvent.MOUSE_UP -> closeWindow",
              "test_type":"pointer event evidence, not AVM2 event dispatch proof",
              "relative_button_center":[385,568],
              "scores":scores,
              "no_confirmed_sprite_character_ids":True,
              "modal_confirmed_dismissed":False,
              "modal_dismissal_candidate_by_pixels":scores["dialog_second_up_vs_before"]>0.18,
              "warning_overlay_considered":True,
              "modal_dismissal_visual_review_required":True,
              "limitations":"Pixel differences are not proof of AS3 handler execution"
          }
          (root/"button_event_5d8f.json").write_text(json.dumps(result,indent=2)+"\n")
          print("ORIGINAL_BUTTON_5D8F",json.dumps(result))
          PY

      - name: Upload original-game session video/screenshots and fixture manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-wars-original-button-events-5d8f
          path: |
            dist/button-event-5d8f/
            runtime/fixture_5d8c.json
            runtime/server.log
          if-no-files-found: warn
          retention-days: 14
