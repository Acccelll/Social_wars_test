name: Original Projectile Flow 5D.8M

on:
  push:
    paths:
      - ".github/workflows/projectile-flow-5d8m.yml"
      - "tools/projectile_flow_as3_5d8m.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectile-flow-5d8m
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check bounded read-only inspector
        run: python3 -m py_compile tools/projectile_flow_as3_5d8m.py
      - name: Obtain original SWF distribution
        run: |
          mkdir -p runtime
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/AcidCaos/socialwarriors/releases/download/0.02a/social-warriors_0.02a.zip' \
            -o runtime/original.zip
          test "$(stat -c %s runtime/original.zip)" = '492630085'
      - name: Install FFDec 26.3.0
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o runtime/ffdec.zip
          mkdir -p runtime/ffdec
          unzip -q runtime/ffdec.zip -d runtime/ffdec
          jar="$(find runtime/ffdec -name ffdec.jar -type f -print -quit)"
          test -n "$jar"
          echo "FFDEC_JAR=$jar" >> "$GITHUB_ENV"
      - name: Extract source flow and bounded relevant effect filenames
        run: |
          python3 tools/projectile_flow_as3_5d8m.py \
            --archive runtime/original.zip \
            --ffdec "$FFDEC_JAR" \
            --out dist/projectile-flow-5d8m
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/projectile-flow-5d8m/projectile_call_graph.json')
          data=json.loads(p.read_text())
          assert data['original_swf_untouched']
          assert data['sha256']=='e4ce0218920a30fceee85ba750df3eedffa3f90e977bd117655704e297e0dc77'
          assert 'battle.projectiles.ProjectileDefinition' in data['found_classes']
          assert 'managers.ProjectileManager' in data['found_classes']
          assert len(data['method_summaries'])>=10
          assert sum(len(x['related_methods']) for x in data['method_summaries'])>=20
          assert data['exports']['as']['code']==0
          print('PROJECTILE_FLOW_VALIDATED_5D8M',json.dumps({
            'class_count':len(data['found_classes']),
            'method_count':sum(len(x['related_methods']) for x in data['method_summaries']),
            'candidate_external_swf_names':data['external_swf_filename_matches_total']
          }))
          PY
      - name: Preserve detailed decompilation and bounded static index as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-projectile-flow-5d8m
          path: dist/projectile-flow-5d8m/
          retention-days: 14
          if-no-files-found: warn
