name: AS3 Probe Build

on:
  push:
    paths:
      - 'as3/**'
      - 'tools/**'
      - 'tests/ruffle/**'
      - '.github/workflows/as3-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-run-as3-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 8 for Flex
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Python A-star formula tests
        run: python3 tools/test_astar_cost.py

      - name: Download compiler and playerglobal
        run: bash tools/bootstrap_flex_linux.sh

      - name: Compile proof-of-concept SWF
        run: bash tools/build_probe_linux.sh

      - name: Compile typed contract probe
        run: bash tools/build_contract_probe_linux.sh

      - name: Check SWF header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("AS3Probe.swf", "ContractProbe.swf"):
              p = Path("dist") / name
              data = p.read_bytes()
              assert len(data) > 12, "empty/invalid SWF"
              assert data[:3] in (b"FWS", b"CWS", b"ZWS"), "not an SWF"
              print(f"{name} header {data[:3]!r}, size {len(data)} bytes")
          PY

      - name: Setup Node for Ruffle smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Ruffle and Playwright
        run: npm install --prefix tests/ruffle --no-audit --no-fund

      - name: Install headless Chromium
        run: |
          cd tests/ruffle
          npx playwright install chromium --with-deps

      - name: Run experimental AStar in Ruffle
        run: npm run smoke --prefix tests/ruffle
        env:
          SW_SMOKE_SWF: AS3Probe.swf
          SW_EXPECT_TESTS: '8'

      - name: Run nominal IsoUnit contract in Ruffle
        run: npm run smoke --prefix tests/ruffle
        env:
          SW_SMOKE_SWF: ContractProbe.swf
          SW_EXPECT_TESTS: '15'

      - name: Upload SWF proof of concept
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-wars-as3-probe
          path: |
            dist/AS3Probe.swf
            dist/ContractProbe.swf
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Ruffle smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-wars-ruffle-smoke
          path: dist/ruffle-smoke/
          if-no-files-found: warn
          retention-days: 14
