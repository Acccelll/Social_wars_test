name: Isolated Original Unit Movement 5D.8H

on:
  push:
    paths:
      - '.github/workflows/isolated-original-unit-5d8h.yml'
      - 'tests/original/client_move_5d8h.mjs'
      - 'tools/seed_original_unit_5d8h.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-original-unit-5d8h
  cancel-in-progress: false

jobs:
  original-client-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate original fixture and recorder syntax
        run: |
          python tools/seed_original_units_5d8c_test.py
          node --check tests/original/client_move_5d8h.mjs
          python -m py_compile tools/seed_original_unit_5d8h.py
      - name: Install Playwright and Ruffle
        run: |
          npm install --prefix tests/ruffle --no-audit --no-fund
          npx --prefix tests/ruffle playwright install chromium
          node tests/original/test.mjs
      - name: Download original Social Wars distribution and Flask source
        run: |
          mkdir -p runtime/release
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/AcidCaos/socialwarriors/releases/download/0.02a/social-warriors_0.02a.zip' \
            -o runtime/release.zip
          test "$(stat -c %s runtime/release.zip)" = '492630085'
          unzip -q runtime/release.zip -d runtime/release
          asset_file="$(find runtime/release -path '*/assets/flash/Basesec_1.5.4.swf' -type f -print -quit)"
          test -n "$asset_file"
          asset_dir="$(realpath "$(dirname "$(dirname "$asset_file")")")"
          git clone --depth 1 --filter=blob:none --sparse \
            'https://github.com/AcidCaos/socialwarriors.git' runtime/source
          git -C runtime/source sparse-checkout set config villages templates stub mods
          ln -s "$asset_dir" runtime/source/assets
          test -f runtime/source/server.py
          mkdir -p runtime/source/saves
          test -z "$(find runtime/source/saves -name '*.save.json' -print -quit)"
          echo "SW_SERVER_DIR=$(realpath runtime/source)" >> "$GITHUB_ENV"
      - name: Verify original unit IDs and retain clean template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          patch=json.loads(Path('runtime/source/config/patch/unit_patch.json').read_text())
          catalog={int(row['value']['id']):row['value'] for row in patch
                   if isinstance(row,dict) and isinstance(row.get('value'),dict)
                   and 'id' in row['value']}
          for key in (1313,1358,1376):
              assert catalog[key]['type']=='u'
              print('ORIGINAL_UNIT_VERIFIED',key,catalog[key]['name'])
          PY
          cp "$SW_SERVER_DIR/villages/initial.json" runtime/initial-pristine.json
      - name: Install original Flask requirements
        run: python -m pip install 'flask==2.2.5' 'werkzeug==2.3.8' requests jsonpatch
      - name: Test each original unit in its own fresh village
        shell: bash
        run: |
          set -euo pipefail
          for scenario in bushwacker reaper splinter; do
            echo "===== SCENARIO: $scenario ====="
            test "$(realpath "$SW_SERVER_DIR")" = "$(realpath runtime/source)"
            test -z "$(find "$SW_SERVER_DIR/saves" -maxdepth 1 -name '*.save.json' -print -quit)"
            python tools/seed_original_unit_5d8h.py \
              --pristine runtime/initial-pristine.json \
              --out "$SW_SERVER_DIR/villages/initial.json" \
              --scenario "$scenario" \
              --manifest "runtime/fixture_5d8h_${scenario}.json"
            pushd "$SW_SERVER_DIR" >/dev/null
            python -u server.py --host 127.0.0.1 --port 5055 > "$GITHUB_WORKSPACE/runtime/server-${scenario}-private.log" 2>&1 &
            server_pid=$!
            popd >/dev/null
            ready=0
            for i in $(seq 1 60); do
              if curl --fail --silent 'http://127.0.0.1:5055/health' >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then kill "$server_pid" || true; exit 1; fi
            node tests/original/client_move_5d8h.mjs \
              --server 'http://127.0.0.1:5055' \
              --save-dir "$SW_SERVER_DIR/saves" \
              --fixture "runtime/fixture_5d8h_${scenario}.json" \
              --out "dist/5d8h/${scenario}"
            kill "$server_pid"
            wait "$server_pid" || true
            python - "$scenario" <<'PY'
          import json
          import sys
          from pathlib import Path
          scenario=sys.argv[1]
          p=Path('dist/5d8h')/scenario
          report=json.loads((p/'report.json').read_text())
          fixture=json.loads((Path('runtime')/f'fixture_5d8h_{scenario}.json').read_text())
          assert report['single_seeded_unit'] and report['seeded_unit']==fixture['seeded_units'][0]
          assert report['original_swf_untouched'] and report['no_synthetic_move_posts']
          assert report['modal_ok_clicks']==2 and report['attempts']>0
          assert (p/'session.webm').stat().st_size>1000
          assert report['browser_move_and_save_persistence_matched']==bool(
            any(cmd['action']=='move' and cmd.get('map_index')==report['seeded_unit']['index']
                and cmd.get('destination')==u['to']
                for req in report['requests'] for cmd in req['commands']
                for u in report['moved_seeded_units']))
          print('SCENARIO_RESULT_5D8H',json.dumps({
            'unit':scenario,'attempts':report['attempts'],
            'original_client_move_count':report['browser_move_count'],
            'move_and_save_matched':report['browser_move_and_save_persistence_matched'],
            'saved_moves':report['moved_seeded_units'],
            'sprite_character_id':report['sprite_define_id_confirmed']
          }))
          PY
            # These files only exist in the newly cloned, disposable CI checkout.
            find "$SW_SERVER_DIR/saves" -maxdepth 1 -type f -name '*.save.json' -delete
          done
      - name: Aggregate all three independent cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('dist/5d8h')
          reports={x:json.loads((out/x/'report.json').read_text())
                   for x in ('bushwacker','reaper','splinter')}
          summary={
            'lot':'5D.8H',
            'one_unit_per_isolated_village':True,
            'source_original_swf_unchanged':True,
            'scenario_count':len(reports),
            'results':{
                k:{
                   'item_id':r['seeded_unit']['item_id'],
                   'map_index':r['seeded_unit']['index'],
                   'attempts':r['attempts'],
                   'browser_move_count':r['browser_move_count'],
                   'save_move_matched':r['browser_move_and_save_persistence_matched'],
                   'moved_seeded_units':r['moved_seeded_units'],
                   'sprite_id':None
                } for k,r in reports.items()},
            'visual_sprite_id_proven':False,
            'notes':'Only a single seeded controllable unit per scenario; sprite DefineSprite mapping still unknown.'
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('SUMMARY_5D8H',json.dumps(summary))
          PY
      - name: Upload sanitized movement report, screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-original-unit-5d8h
          path: |
            dist/5d8h/
            runtime/fixture_5d8h_*.json
          retention-days: 14
          if-no-files-found: warn
