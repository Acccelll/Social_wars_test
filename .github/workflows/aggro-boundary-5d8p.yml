name: Original Aggro Boundary and AS3 5D.8P

on:
  push:
    paths:
      - '.github/workflows/aggro-boundary-5d8p.yml'
      - 'tools/seed_auto_aggro_5d8p.py'
      - 'tests/original/client_aggro_threshold_5d8p.mjs'
      - 'tools/original_aggro_as3_5d8p.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-aggro:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate decompilation tool
        run: python3 -m py_compile tools/original_aggro_as3_5d8p.py
      - name: Download original 0.02a and FFDec 26.3.0
        run: |
          mkdir -p runtime/ffdec
          curl --fail -L --retry 3 \
            'https://github.com/AcidCaos/socialwarriors/releases/download/0.02a/social-warriors_0.02a.zip' \
            -o runtime/release.zip
          test "$(stat -c %s runtime/release.zip)" = 492630085
          curl --fail -L --retry 3 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o runtime/ffdec.zip
          unzip -q runtime/ffdec.zip -d runtime/ffdec
          jar="$(find runtime/ffdec -name ffdec.jar -type f -print -quit)"
          test -n "$jar"
          echo "FFDEC_JAR=$jar" >> "$GITHUB_ENV"
      - name: Extract original Config and target acquisition sources
        run: |
          python3 tools/original_aggro_as3_5d8p.py \
            --archive runtime/release.zip --ffdec "$FFDEC_JAR" \
            --out dist/aggro-source-5d8p
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('dist/aggro-source-5d8p/aggro_code_index.json').read_text())
          assert x['original_swf_untouched']
          assert 'core.Config' in x['found_classes']
          assert 'core.isoengine.IsoFightingElement' in x['found_classes']
          assert x['aggro_range_static_declarations'], 'No literal declaration of Config.AGGRO_RANGE'
          print('VERIFIED_AGGRO_AS3_5D8P',json.dumps(x['aggro_range_static_declarations']))
          PY
      - name: Archive original decompilation and index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-aggro-as3-5d8p
          path: dist/aggro-source-5d8p/
          retention-days: 14
          if-no-files-found: warn

  boundary-test:
    strategy:
      fail-fast: false
      matrix:
        axis: [north, east]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AXIS: "${{ matrix.axis }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fixture and recorder syntax
        run: |
          python3 -m py_compile tools/seed_auto_aggro_5d8p.py
          node --check tests/original/client_aggro_threshold_5d8p.mjs
          python tools/seed_original_units_5d8c_test.py
      - name: Install Ruffle and Playwright browser
        run: |
          npm install --prefix tests/ruffle --no-audit --no-fund
          npx --prefix tests/ruffle playwright install chromium
          node tests/original/test.mjs
      - name: Download unchanged original SWF and Flask source
        run: |
          mkdir -p runtime/release
          curl --fail -L --retry 3 --connect-timeout 20 \
            'https://github.com/AcidCaos/socialwarriors/releases/download/0.02a/social-warriors_0.02a.zip' \
            -o runtime/release.zip
          test "$(stat -c %s runtime/release.zip)" = 492630085
          unzip -q runtime/release.zip -d runtime/release
          asset_file="$(find runtime/release -path '*/assets/flash/Basesec_1.5.4.swf' -type f -print -quit)"
          test -n "$asset_file"
          echo "e4ce0218920a30fceee85ba750df3eedffa3f90e977bd117655704e297e0dc77  $asset_file" | sha256sum -c
          asset_dir="$(realpath "$(dirname "$(dirname "$asset_file")")")"
          git clone --depth 1 --filter=blob:none --sparse \
            'https://github.com/AcidCaos/socialwarriors.git' runtime/source
          git -C runtime/source sparse-checkout set config villages templates stub mods
          ln -s "$asset_dir" runtime/source/assets
          test -f runtime/source/server.py
          mkdir -p runtime/source/saves
          test -z "$(find runtime/source/saves -maxdepth 1 -name '*.save.json' -print -quit)"
          cp runtime/source/villages/initial.json runtime/initial-pristine.json
          echo "SW_SERVER_DIR=$(realpath runtime/source)" >> "$GITHUB_ENV"
      - name: Install original Flask dependencies
        run: python -m pip install 'flask==2.2.5' 'werkzeug==2.3.8' requests jsonpatch
      - name: Observe original auto-aggro distances 16 to 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/aggro-threshold-5d8p/$AXIS"
          for dist in 16 17 18 19; do
            scenario="$AXIS"_"$dist"
            echo "AGGRO_SCENARIO_5D8P $scenario"
            test -z "$(find "$SW_SERVER_DIR/saves" -maxdepth 1 -name '*.save.json' -print -quit)"
            python tools/seed_auto_aggro_5d8p.py \
              --pristine runtime/initial-pristine.json \
              --out "$SW_SERVER_DIR/villages/initial.json" \
              --scenario "$scenario" \
              --manifest "runtime/fixture-$scenario.json"
            pushd "$SW_SERVER_DIR" >/dev/null
            python -u server.py --host 127.0.0.1 --port 5055 > "$GITHUB_WORKSPACE/runtime/server-$scenario-private.log" 2>&1 &
            server_pid=$!
            popd >/dev/null
            ready=0
            for i in $(seq 1 60); do
              if curl --fail -s 'http://127.0.0.1:5055/health' >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then kill "$server_pid" || true; exit 1; fi
            node tests/original/client_aggro_threshold_5d8p.mjs \
              --server http://127.0.0.1:5055 \
              --save-dir "$SW_SERVER_DIR/saves" \
              --fixture "runtime/fixture-$scenario.json" \
              --out "dist/aggro-threshold-5d8p/$AXIS/$scenario"
            kill "$server_pid" || true
            wait "$server_pid" || true
            find "$SW_SERVER_DIR/saves" -maxdepth 1 -name '*.save.json' -type f -delete
          done
      - name: Validate original observations with explicit limitations
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          axis=os.environ['AXIS']
          root=Path('dist/aggro-threshold-5d8p')/axis
          results=[]
          for d in (16,17,18,19):
              s=f'{axis}_{d}'
              path=root/s
              a=json.loads((path/'report.json').read_text())
              assert a['lot']=='5D.8P-two-axis-aggro'
              assert a['scenario']==s and a['axis']==axis and a['manhattan_distance_tiles']==d
              assert a['control_no_unit_clicks'] and a['manual_unit_click_count']==0
              assert a['no_synthetic_combat_posts'] and a['original_swf_untouched']
              assert a['errors']==[]
              assert len(a['state_samples'])>=2
              assert (path/'session.webm').stat().st_size>1000
              kills=[r['at_ms'] for r in a['requests']
                  if any(c['action']=='kill' and c.get('object_reference')==42 for c in r['commands'])]
              if kills:assert a['target_removed_from_save']
              rec={'scenario':s,'axis':axis,'distance':d,
                  'native_kill':bool(kills),'kill_at_ms':kills,
                  'target_removed':a['target_removed_from_save'],
                  'attacker_start_tile':a['initial_attacker_tile'],
                  'attacker_end_tile':a['unit_summaries'][0]['after'].get('tile'),
                  'enemy_end_tile':a['unit_summaries'][1]['after'].get('tile'),
                  'native_move_commands':a['native_move_commands'],
                  'command_names':a['command_names'][-20:],
                  'control_window_ms':a['state_samples'][-1]['at_ms']-a['state_samples'][0]['at_ms'],
                  'errors':a['errors']}
              results.append(rec)
              print('AGGRO_THRESHOLD_VERIFIED_5D8P',json.dumps(rec))
          (root/'axis_summary.json').write_text(json.dumps({
            'lot':'5D.8P','axis':axis,'observations':results,
            'limit':'No kill during a finite window is not proof of no acquisition or aggro.'
          },indent=2)+'\n')
          PY
      - name: Archive original combat evidence for this axis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-aggro-5d8p-${{ matrix.axis }}
          path: |
            dist/aggro-threshold-5d8p/
            runtime/fixture-*.json
          retention-days: 14
          if-no-files-found: warn
